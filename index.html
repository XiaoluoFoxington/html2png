<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="输入 HTML 代码，实时预览并生成 PNG / JPEG / WebP 图片。原生静态前端，沙箱隔离，安全可靠。">
  <title>HTML → PNG · 代码转图片</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/tokens.css?v=5">
  <link rel="stylesheet" href="css/base.css?v=5">
  <link rel="stylesheet" href="css/layout.css?v=5">
  <link rel="stylesheet" href="css/components.css?v=5">
  <link rel="stylesheet" href="css/editor.css?v=5">
  <link rel="stylesheet" href="css/preview.css?v=5">
</head>
<body>
  <div class="app">

    <!-- ===== 顶栏 ===== -->
    <header class="app-header">
      <div class="brand">
        <img class="brand-icon" src="assets/favicon.svg" alt="" width="34" height="34">
        <div>
          <h1>HTML → PNG</h1>
          <p>代码渲染成图片 · 实时预览 · 沙箱隔离</p>
        </div>
      </div>
      <div class="header-actions">
        <select id="example-select" class="select" title="加载示例模板">
          <option value="">示例模板…</option>
        </select>
        <button id="btn-clear" class="btn btn-ghost" type="button">清空</button>
        <button id="btn-copy" class="btn btn-ghost" type="button">复制图片</button>
        <button id="btn-download" class="btn btn-primary" type="button">下载图片</button>
      </div>
    </header>

    <!-- ===== 主体 ===== -->
    <main class="app-body">

      <!-- 左：代码编辑 -->
      <section class="panel">
        <div class="panel-head">
          <h2>HTML 代码</h2>
          <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 快速下载</span>
        </div>
        <div id="editor"></div>
      </section>

      <!-- 右：预览与输出 -->
      <section class="panel">
        <div class="panel-head">
          <h2>预览与输出</h2>
          <div class="stats" id="stats">—</div>
        </div>

        <div class="error-banner hidden" id="error-banner" role="alert">
          <span class="err-msg" id="err-msg"></span>
          <button class="err-close" id="err-close" type="button" title="关闭">✕</button>
        </div>

        <div class="preview-stage" id="stage">
          <div class="ruler-corner" id="ruler-corner" title="内容尺寸（像素）">—</div>
          <canvas class="ruler-x" id="ruler-x" aria-hidden="true"></canvas>
          <canvas class="ruler-y" id="ruler-y" aria-hidden="true"></canvas>
          <div class="stage-scroll" id="stage-scroll">
            <iframe id="frame" title="HTML 预览" sandbox="allow-scripts"></iframe>
            <div class="stage-empty" id="stage-empty">
              <span class="big">▣</span>
              在左侧输入 HTML 代码，这里会实时预览
            </div>
          </div>
          <div class="stage-overlay hidden" id="stage-overlay">
            <span class="spinner"></span>
            <span id="overlay-text">加载预览…</span>
          </div>
        </div>

        <div class="settings">
          <div class="setting">
            <span class="setting-label">宽度</span>
            <div class="seg" role="radiogroup" aria-label="宽度模式">
              <label class="seg-item">
                <input type="radio" name="widthMode" id="width-auto" value="auto" checked>
                <span>自动</span>
              </label>
              <label class="seg-item">
                <input type="radio" name="widthMode" id="width-fixed" value="fixed">
                <span>固定</span>
              </label>
            </div>
          </div>

          <div class="setting hidden" id="fixed-row">
            <span class="setting-label">固定宽度</span>
            <div class="presets" id="presets"></div>
            <div class="input-wrap">
              <input class="input" id="fixed-width" type="number" min="120" max="4096" step="10" value="1280">
              <span class="unit">px</span>
            </div>
          </div>

          <div class="setting">
            <span class="setting-label">背景</span>
            <select class="select" id="bg-select"></select>
            <input class="color-input hidden" id="custom-bg" type="color" value="#22c55e" title="自定义背景色">
          </div>

          <div class="setting">
            <span class="setting-label">缩放</span>
            <select class="select" id="scale-select" title="输出图片的像素密度"></select>
          </div>

          <div class="setting">
            <span class="setting-label">格式</span>
            <select class="select" id="format-select" title="输出图片格式"></select>
          </div>

          <div class="setting">
            <span class="setting-label">脚本</span>
            <label class="switch" title="在沙箱内执行 HTML 中的 JavaScript（与宿主完全隔离）">
              <input type="checkbox" id="run-scripts">
              <span class="switch-box"></span>
              <span class="switch-text">执行 JS</span>
            </label>
          </div>

          <details class="adv" id="adv-options">
            <summary>高级选项 <span class="adv-hint">html-to-image 扩展 · 仅影响导出</span></summary>
            <div class="adv-grid">
              <div class="setting">
                <span class="setting-label">质量</span>
                <input class="range" id="quality-range" type="range" min="0.5" max="1" step="0.01" value="0.92"
                  title="JPEG / WebP 输出质量（PNG 无损，不受影响）">
                <span class="range-val" id="quality-val">92%</span>
              </div>
              <div class="setting">
                <span class="setting-label">字体格式</span>
                <select class="select" id="font-format" title="@font-face 首选嵌入格式（'' 自动）"></select>
              </div>
              <div class="setting">
                <span class="setting-label">字体嵌入</span>
                <label class="switch" title="跳过 @font-face 字体嵌入（更快，但自定义字体可能丢失）">
                  <input type="checkbox" id="skip-fonts">
                  <span class="switch-box"></span>
                  <span class="switch-text">跳过嵌入</span>
                </label>
              </div>
              <div class="setting">
                <span class="setting-label">资源</span>
                <label class="switch" title="资源 URL 保留查询参数（影响缓存键，默认剥离）">
                  <input type="checkbox" id="include-params">
                  <span class="switch-box"></span>
                  <span class="switch-text">保留查询参数</span>
                </label>
                <label class="switch" title="资源 URL 追加时间戳，绕过 HTTP 缓存">
                  <input type="checkbox" id="cache-bust">
                  <span class="switch-box"></span>
                  <span class="switch-text">绕过缓存</span>
                </label>
              </div>
              <div class="setting">
                <span class="setting-label">占位色</span>
                <input class="color-input" id="placeholder-color" type="color" value="#e5e7eb"
                  title="跨域资源加载失败时导出的占位色">
              </div>
              <div class="setting setting-wide">
                <span class="setting-label">字体 CSS</span>
                <input class="input input-wide" id="font-embed-css" type="text" spellcheck="false"
                  placeholder="自定义 @font-face CSS，如：@font-face{font-family:X;src:url(...)}"
                  title="直接指定要嵌入的字体 CSS，覆盖自动检测（留空则自动）">
              </div>
              <div class="setting setting-wide">
                <span class="setting-label">排除元素</span>
                <input class="input input-wide" id="filter-selector" type="text" spellcheck="false"
                  placeholder="CSS 选择器，逗号分隔，如：.ad, #banner, [data-hide]"
                  title="导出时排除匹配的元素（相当于库的 filter 选项，不影响预览）">
              </div>
              <div class="setting setting-wide">
                <span class="setting-label">附加样式</span>
                <input class="input input-wide" id="extra-style" type="text" spellcheck="false"
                  placeholder="CSS 声明，如：font-family: Arial; font-size: 16px"
                  title="导出时应用到根元素的样式（相当于库的 style 选项，不影响预览）">
              </div>
            </div>
          </details>
        </div>
      </section>

    </main>

  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript>本工具需要启用 JavaScript 才能运行。</noscript>
  <script type="module" src="js/main.js?v=5"></script>
</body>
</html>
